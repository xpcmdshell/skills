# New projects inherit this explicit baseline instead of version-dependent defaults.
# Existing projects merge only extend-select into their current lint policy.
[lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "B009",   # Constant-name getattr without a default.
    "B010",   # Constant-name setattr.
    "B012",   # Control flow that discards an exception in finally.
    "E722",   # Bare except handlers.
    "PGH003", # Blanket type ignores.
    "PGH004", # Blanket lint suppressions.
    "TRY203", # Handlers that only reraise.
]
